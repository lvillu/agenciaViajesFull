services:
  # PostgreSQL 16 Database
  database:
    image: postgres:16-alpine
    container_name: agencia_viajes_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ibarratravel}
    ports:
      # Host 5433 para evitar conflicto con otros proyectos que usan 5432 en el host
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agencia_viajes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # .NET 10 API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agencia_viajes_api:latest
    container_name: agencia_viajes_api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__IbarraTravelDB: "Host=database;Port=5432;Database=${POSTGRES_DB:-ibarratravel};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
      AppSettings__SecretKey: ${SECRET_KEY:-GiveASecretKeyHavingAtLeast32Characters}
      AppSettings__ExperiesInMinutes: ${EXPIRES_IN_MINUTES:-2}
      AppSettings__RefreshTokenExpiresInMinutes: ${REFRESH_TOKEN_EXPIRES_IN_MINUTES:-60}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # KrakenD API Gateway
  krakend:
    build:
      context: ./deploy/KrakenD
      dockerfile: Dockerfile
    image: agencia_viajes_krakend:latest
    container_name: agencia_viajes_krakend
    ports:
      - "5050:8080"
    depends_on:
      - api
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Next.js Frontend (standalone mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se hornea en el bundle en BUILD time.
        # Debe apuntar al gateway visible desde el navegador, nunca a un hostname interno de Docker.
        NEXT_PUBLIC_API_URL: http://localhost:5050
    image: agencia_viajes_frontend:latest
    container_name: agencia_viajes_frontend
    ports:
      # Host 3100 para evitar conflictos con el puerto 3000, usado frecuentemente por otros proyectos
      - "3100:3000"
    depends_on:
      - krakend
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
    driver: local

networks:
  agencia_viajes_network:
    driver: bridge
