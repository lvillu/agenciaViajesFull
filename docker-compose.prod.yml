version: '3.8'

# ============================================================
# docker-compose.prod.yml — Producción en AWS EC2 + RDS
# Uso: docker-compose -f docker-compose.prod.yml up -d --build
# Requiere archivo .env con las variables definidas en .env.prod.example
# ============================================================
#
# Arquitectura:
#   Browser → EC2:3000 (Frontend Next.js)
#              ↓
#           EC2:5050 (KrakenD API Gateway)  [NEXT_PUBLIC_API_URL apunta aquí]
#              ↓
#           EC2:8080 (API .NET — red interna)
#              ↓
#           RDS PostgreSQL (db.t3.micro free tier)

services:

  # .NET 8 API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agencia_viajes_api:prod
    container_name: agencia_viajes_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IbarraTravelDB: "Host=${RDS_HOST};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Require;Trust Server Certificate=true;"
      AppSettings__SecretKey: ${SECRET_KEY}
      AppSettings__ExperiesInMinutes: ${EXPIRES_IN_MINUTES:-30}
      AppSettings__RefreshTokenExpiresInMinutes: ${REFRESH_TOKEN_EXPIRES_IN_MINUTES:-1440}
      # Orígenes CORS: separados por coma. Ejemplo: http://54.123.45.67:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # KrakenD API Gateway (CORS dinámico vía entrypoint)
  krakend:
    build:
      context: ./deploy/KrakenD
      dockerfile: Dockerfile.prod
    image: agencia_viajes_krakend:prod
    container_name: agencia_viajes_krakend
    environment:
      # Origen permitido para CORS: URL pública del frontend
      # Ejemplo: http://54.123.45.67:3000  o  https://tudominio.com
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "5050:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Next.js Frontend (standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se hornea en el bundle en tiempo de build.
        # Debe ser la URL pública de KrakenD (accesible desde el browser).
        # Ejemplo: http://54.123.45.67:5050  o  https://api.tudominio.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: agencia_viajes_frontend:prod
    container_name: agencia_viajes_frontend
    ports:
      - "3000:3000"
    depends_on:
      - krakend
    networks:
      - agencia_viajes_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  agencia_viajes_network:
    driver: bridge
